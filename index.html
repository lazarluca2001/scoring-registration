<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nevezés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#eef1f6; --head:#0b1a45; --head-ink:#fff; --card:#fff; --ink:#111a33; --soft:#7a849b;
    --line:#dfe3ec; --accent:#1d4ed8; --on-accent:#fff; --sel:#eaf0ff; --err:#d23a46;
  }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 Inter, system-ui, sans-serif; min-height:100vh; }

  header { background:var(--head); color:var(--head-ink); padding:40px 16px 96px; text-align:center; position:relative; }
  header h1 { font-weight:600; font-size:clamp(1.6rem, 4.5vw, 2.6rem); line-height:1.15; }

  main { position:relative; z-index:1; max-width:900px; margin:-64px auto 48px; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden;
          box-shadow:0 10px 30px rgba(11,26,69,.08); }

  /* Lépésjelző */
  .steps { display:flex; align-items:center; padding:24px 24px 8px; }
  .steps .s { width:36px; height:36px; border-radius:50%; border:2px solid var(--line); color:var(--soft);
              display:grid; place-items:center; font-weight:600; font-size:.9rem; flex:none; transition:.25s; }
  .steps .s.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .steps .s.past { border-color:var(--accent); color:var(--accent); }
  .steps .l { flex:1; height:2px; background:var(--line); margin:0 10px; position:relative; }
  .steps .l i { position:absolute; inset:0; background:var(--accent); transform:scaleX(0); transform-origin:left; transition:transform .3s; }

  .body { padding:24px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; }
  .grid .full { grid-column:1 / -1; }
  @media (max-width:700px) { .grid { grid-template-columns:1fr; } }
  label.f { display:block; font-size:.9rem; font-weight:500; margin-bottom:6px; }
  input[type=text] { width:100%; height:46px; padding:0 14px; font:inherit; color:var(--ink); background:var(--card);
                     border:1px solid var(--line); border-radius:6px; outline:none; transition:border-color .2s; }
  input[type=text]:focus { border-color:var(--accent); }
  input[type=text]:disabled { background:var(--bg); color:var(--soft); }
  input::placeholder { color:var(--soft); opacity:.7; }
  .chk { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:.88rem; color:var(--soft); cursor:pointer; width:max-content; }
  .chk input { width:16px; height:16px; accent-color:var(--accent); }

  .grp + .grp { margin-top:24px; }
  .grp h2 { font-size:.75rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--soft); margin-bottom:8px; }
  .rows { border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; }
  .row + .row { border-top:1px solid var(--line); }
  .row.sel { background:var(--sel); }
  .row .n { font-weight:500; }
  .seg { display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; flex:none; }
  .seg button { border:0; background:var(--card); color:var(--soft); font:500 .85rem Inter, sans-serif;
                padding:8px 14px; cursor:pointer; transition:background .15s, color .15s; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button:hover { color:var(--ink); }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); }
  .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  .who { font-weight:600; margin-bottom:16px; }
  .who span { color:var(--soft); font-weight:400; margin-left:6px; }
  .empty { color:var(--soft); }

  footer.act { display:flex; align-items:center; justify-content:space-between; gap:12px;
               border-top:1px solid var(--line); padding:14px 24px; }
  .msg { flex:1; font-size:.88rem; color:var(--err); }
  .msg.info { color:var(--soft); }
  .btn { height:42px; padding:0 20px; border:0; border-radius:6px; background:var(--accent); color:var(--on-accent);
         font:600 .95rem Inter, sans-serif; cursor:pointer; white-space:nowrap; }
  .btn:disabled { opacity:.4; cursor:default; }
  .ghost { height:42px; width:46px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--ink);
           cursor:pointer; display:grid; place-items:center; flex:none; }
  .ghost svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  .done { text-align:center; padding:40px 24px; }
  .done .ok { width:64px; height:64px; border-radius:50%; background:var(--accent); color:var(--on-accent);
              display:grid; place-items:center; margin:0 auto 18px; }
  .done .ok svg { width:30px; height:30px; fill:none; stroke:currentColor; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .done h2 { font-weight:600; margin-bottom:10px; }
  .done ul { list-style:none; padding:0; color:var(--soft); margin-bottom:24px; }
  .reg { display:inline-block; margin:6px 0 6px; padding:12px 22px; border:2px dashed var(--accent); border-radius:10px;
         font:700 1.8rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.12em; color:var(--accent); }
  .reg-l { color:var(--soft); font-size:.85rem; }
  .note { color:var(--soft); font-size:.88rem; margin:10px 0 22px; }

  .hp { position:absolute; left:-9999px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1 id="cim">Nevezés</h1>
</header>

<main>
  <div class="card">
    <div class="steps" aria-hidden="true">
      <div class="s on" id="s1">1</div><div class="l"><i id="bar"></i></div><div class="s" id="s2">2</div>
    </div>

    <!-- 1. lépés -->
    <section id="lepes1">
      <div class="body">
        <div class="grid">
          <div>
            <label class="f" for="wsdc">WSDC azonosító</label>
            <input type="text" id="wsdc" inputmode="numeric" placeholder="WSDC azonosító" autocomplete="off">
            <label class="chk"><input type="checkbox" id="nincs"> Nincs WSDC azonosítóm</label>
          </div>
          <div>
            <label class="f" for="kn">Keresztnév</label>
            <input type="text" id="kn" placeholder="Keresztnév" autocomplete="given-name" disabled>
          </div>
          <div>
            <label class="f" for="vn">Vezetéknév</label>
            <input type="text" id="vn" placeholder="Vezetéknév" autocomplete="family-name" disabled>
          </div>
        </div>
        <input type="text" id="web" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      </div>
      <footer class="act">
        <p class="msg" id="msg1" role="status"></p>
        <button class="btn" id="tovabb">Következő</button>
      </footer>
    </section>

    <!-- 2. lépés -->
    <section id="lepes2" hidden>
      <div class="body">
        <p class="who"><b id="whoNev"></b><span id="whoId"></span></p>
        <div id="divlist"></div>
      </div>
      <footer class="act">
        <button class="ghost" id="vissza" aria-label="Vissza"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <p class="msg" id="msg2" role="status"></p>
        <button class="btn" id="kuld" disabled>Regisztráció befejezése</button>
      </footer>
    </section>

    <!-- Kész -->
    <section id="kesz" hidden>
      <div class="done">
        <div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div>
        <h2>Sikeres nevezés</h2>
        <div class="reg-l">Regisztrációs szám</div>
        <div class="reg" id="regszam"></div>
        <p class="note" id="regNote"></p>
        <ul id="keszLista"></ul>
        <button class="btn" id="ujra">Új nevezés</button>
      </div>
    </section>
  </div>
</main>

<script>
// ====== BEÁLLÍTÁSOK ======
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwCRpBEvibsSmcKRuPvEcv0PXr89yVJMCT66VBkpzxTXW2I5_F9EHGjLDV1qFM_niNZZg/exec';
const VERSENY_NEV = 'Nevezés';
// =========================

const $ = id => document.getElementById(id);
const msg = (el, t, info) => { $(el).textContent = t || ''; $(el).className = 'msg' + (info ? ' info' : ''); };
let adat = null; // { wsdc, keresztnev, vezeteknev, diviziok }

$('cim').textContent = VERSENY_NEV;
document.title = VERSENY_NEV;

// Nincs azonosító → névmezők nyitva
$('nincs').addEventListener('change', () => {
  const n = $('nincs').checked;
  $('wsdc').disabled = n; if (n) $('wsdc').value = '';
  $('kn').disabled = $('vn').disabled = !n;
  $('kn').value = $('vn').value = '';
  adat = null; msg('msg1');
  if (n) $('kn').focus();
});

// ID → név automatikusan
let idoz;
$('wsdc').addEventListener('input', () => {
  $('wsdc').value = $('wsdc').value.replace(/\D/g, '');
  clearTimeout(idoz);
  adat = null; $('kn').value = $('vn').value = ''; msg('msg1');
  const id = $('wsdc').value;
  if (id) idoz = setTimeout(() => lekerdez(id), 500);
});
['wsdc', 'vn'].forEach(i => $(i).addEventListener('keydown', e => { if (e.key === 'Enter') $('tovabb').click(); }));

async function lekerdez(id) {
  msg('msg1', 'Keresés…', true);
  try {
    const v = await (await fetch(SCRIPT_URL + '?wsdc=' + encodeURIComponent(id))).json();
    if ($('wsdc').value !== id) return;
    if (!v.ok) { adat = null; return msg('msg1', v.hiba); }
    $('kn').value = v.keresztnev; $('vn').value = v.vezeteknev;
    adat = { wsdc: id, keresztnev: v.keresztnev, vezeteknev: v.vezeteknev, diviziok: v.diviziok };
    msg('msg1');
  } catch { msg('msg1', 'Hálózati hiba.'); }
}

$('tovabb').addEventListener('click', async () => {
  if ($('nincs').checked) {
    const kn = $('kn').value.trim(), vn = $('vn').value.trim();
    if (!kn || !vn) return msg('msg1', 'Add meg a neved.');
    $('tovabb').disabled = true; msg('msg1', 'Betöltés…', true);
    try {
      const v = await (await fetch(SCRIPT_URL)).json();
      if (!v.ok) return msg('msg1', v.hiba);
      adat = { wsdc: '', keresztnev: kn, vezeteknev: vn, diviziok: v.diviziok };
    } catch { return msg('msg1', 'Hálózati hiba.'); }
    finally { $('tovabb').disabled = false; }
  } else {
    const id = $('wsdc').value;
    if (!id) return msg('msg1', 'Add meg a WSDC azonosítód.');
    if (!adat || adat.wsdc !== id) { clearTimeout(idoz); await lekerdez(id); if (!adat) return; }
  }
  msg('msg1');
  mutat2();
});

let valasztas = {}; // divízió (szerep nélkül) → kiválasztott divízió neve

function csoport(nev) {
  if (/strictly/i.test(nev)) return 'Strictly';
  if (/jack\s*&?\s*jill|j&j/i.test(nev)) return 'Jack & Jill';
  return 'Egyéb';
}
function rovid(alap, c) {
  const r = c === 'Strictly' ? alap.replace(/strictly/i, '')
          : c === 'Jack & Jill' ? alap.replace(/jack\s*&?\s*jill|j&j/i, '') : alap;
  return r.replace(/\s+/g, ' ').trim() || alap;
}

function mutat2() {
  $('whoNev').textContent = adat.keresztnev + ' ' + adat.vezeteknev;
  $('whoId').textContent = adat.wsdc ? '#' + adat.wsdc : '';
  valasztas = {};

  // Egy sor = egy divízió, benne az elérhető szerepek
  const sorok = new Map();
  adat.diviziok.forEach(d => {
    const alap = d.alap || d.nev;
    if (!sorok.has(alap)) sorok.set(alap, []);
    sorok.get(alap).push(d);
  });
  const csop = {};
  sorok.forEach((lista, alap) => (csop[csoport(alap)] ||= []).push([alap, lista]));

  const box = $('divlist');
  box.innerHTML = '';
  if (!sorok.size) box.innerHTML = '<p class="empty">Nincs elérhető divízió.</p>';

  const rend = { Leader: 0, Follower: 1 };
  ['Jack & Jill', 'Strictly', 'Egyéb'].filter(c => csop[c]).forEach(c => {
    const g = document.createElement('div'); g.className = 'grp';
    const h2 = document.createElement('h2'); h2.textContent = c;
    const rows = document.createElement('div'); rows.className = 'rows';
    csop[c].forEach(([alap, lista]) => {
      const row = document.createElement('div'); row.className = 'row';
      const n = document.createElement('span'); n.className = 'n'; n.textContent = rovid(alap, c);
      const seg = document.createElement('div'); seg.className = 'seg';
      seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', alap);
      lista.sort((a, b) => (rend[a.szerep] ?? 2) - (rend[b.szerep] ?? 2)).forEach(d => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = d.szerep || 'Nevezés';
        b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', () => {
          valasztas[alap] = valasztas[alap] === d.nev ? undefined : d.nev;
          seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', 'false'));
          if (valasztas[alap]) b.setAttribute('aria-pressed', 'true');
          row.classList.toggle('sel', !!valasztas[alap]);
          frissit();
        });
        seg.append(b);
      });
      row.append(n, seg); rows.append(row);
    });
    g.append(h2, rows); box.append(g);
  });
  frissit();
  lepes(2);
}

function kivalasztott() { return Object.values(valasztas).filter(Boolean); }

function frissit() {
  $('kuld').disabled = !kivalasztott().length;
}

function lepes(n) {
  $('lepes1').hidden = n !== 1;
  $('lepes2').hidden = n !== 2;
  $('kesz').hidden = n !== 3;
  $('s1').className = 's ' + (n === 1 ? 'on' : 'past');
  $('s2').className = 's ' + (n === 2 ? 'on' : n === 3 ? 'past' : '');
  $('bar').style.transform = `scaleX(${n === 1 ? 0 : 1})`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('vissza').addEventListener('click', () => { msg('msg2'); lepes(1); });

$('kuld').addEventListener('click', async () => {
  if ($('web').value) return; // spam-csapda
  const diviziok = kivalasztott();
  $('kuld').disabled = true; msg('msg2', 'Küldés…', true);
  try {
    const v = await (await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ wsdc: adat.wsdc, keresztnev: adat.keresztnev, vezeteknev: adat.vezeteknev, diviziok })
    })).json();
    if (!v.ok) { frissit(); return msg('msg2', v.hiba); }
    $('keszLista').innerHTML = '';
    $('regszam').textContent = v.regszam;
    $('regNote').textContent = 'A nevezésed a szervezők véglegesítése után válik hivatalossá.';
    (v.osszes || [...v.hozzaadva, ...v.marNevezett]).forEach(d => {
      const li = document.createElement('li'); li.textContent = d; $('keszLista').append(li);
    });
    msg('msg2');
    lepes(3);
  } catch { frissit(); msg('msg2', 'Hálózati hiba.'); }
});

$('ujra').addEventListener('click', () => {
  adat = null;
  $('wsdc').value = $('kn').value = $('vn').value = '';
  $('nincs').checked = false;
  $('nincs').dispatchEvent(new Event('change'));
  lepes(1);
});
</script>
</body>
</html>
