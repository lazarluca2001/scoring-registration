<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Versenyek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/stilus.css">
</head>
<body>
<header>
  <h1 id="cim">Versenyek</h1>
  <p class="sub" id="alcim" hidden></p>
</header>

<main>
  <div class="card valassz" id="uzenet" hidden></div>
  <div class="evracs" id="evRacs"></div>
</main>

<script src="assets/kozos.js"></script>
<script>
// Régi linkek (?e=…&f=…) → az új lapok
if (PARAM.get('e')) {
  const cel = { lista: 'listak', eredmeny: 'eredmenyek' }[PARAM.get('f')] || 'nevezes';
  location.replace(lapUrl(cel, PARAM.get('e')));
}
const q = (PARAM.get('q') || '').trim().toLowerCase();
const korabbi = PARAM.has('korabbi');
navRajzol(q ? 'kereses' : korabbi ? 'korabbi' : 'kozel');
$('cim').textContent = q ? 'Keresés: ' + PARAM.get('q') : korabbi ? 'Korábbi események' : 'Közelgő események';
document.title = $('cim').textContent;

// A kártya: borítókép, név, dátum, helyszín; gombok csak a bekapcsolt lapokhoz
function kartya(x) {
  const lapok = [['nevezes.html', 'Nevezés', 'f', x.fulNevezes !== false && x.nyitva], ['listak.html', 'Listák', 'm', !!x.fulMarshalling],
                 ['eredmenyek.html', 'Eredmények', 's', !!x.fulEredmeny]].filter(l => l[3]);
  const id = x.rovid || x.id;
  const fo = lapUrl(lapok.length ? lapok[0][0] : (x.fulNevezes !== false ? 'nevezes.html' : 'eredmenyek.html'), id);
  const k = el('article', 'evk2');
  const kep = el('a', 'kep'); kep.href = fo; kep.setAttribute('aria-hidden', 'true'); kep.tabIndex = -1;
  const ph = el('div', 'ph', x.nev); kep.append(ph);
  if (x.kep) { const img = document.createElement('img'); img.alt = ''; img.loading = 'lazy'; img.src = kepUrl(x.kep);
    img.addEventListener('error', () => img.remove()); img.addEventListener('load', () => { ph.hidden = true;
      // a kártya a kép saját méretarányát veszi fel, így vágás nélkül, teljes egészében látszik
      if (img.naturalWidth && img.naturalHeight) kep.style.aspectRatio = img.naturalWidth + ' / ' + img.naturalHeight; }); kep.append(img); }
  if (elo(x)) kep.append(el('span', 'elo', 'MOST ZAJLIK'));
  const h3 = el('h3'); const a = el('a', 'cimlink', x.nev); a.href = fo; h3.append(a);
  const adat = el('div', 'adat');
  const sor = (ikon, t, c) => { if (!t) return; const s = el('span', c || ''); s.innerHTML = ikon; s.append(t); adat.append(s); };
  sor(IKON.nap, idoszak(x)); sor(IKON.hely, x.helyszin);
  if (x.fulNevezes !== false && !x.nyitva && !elmult(x)) sor('', 'A nevezés lezárult', 'lez');
  const gs = el('div', 'gs');
  lapok.forEach(([url, t, c]) => { const b = el('a', 'gb ' + c, t + ' »'); b.href = lapUrl(url, id); gs.append(b); });
  gs.hidden = !lapok.length;
  k.append(kep, h3, adat, gs);
  return k;
}

(async () => {
  let lista = null;
  try { const v = await jsonGet({ esemenyek: 1 }); if (v.ok && Array.isArray(v.esemenyek)) lista = v.esemenyek; } catch {}
  if (!lista) { location.replace('nevezes'); return; }   // régi script: egy esemény
  const l = lista
    .filter(x => q ? [x.nev, x.helyszin].join(' ').toLowerCase().includes(q) : elmult(x) === korabbi)
    .sort((a, b) => korabbi ? String(b.vege || b.kezdes).localeCompare(String(a.vege || a.kezdes))
                            : String(a.kezdes || '9999').localeCompare(String(b.kezdes || '9999')));
  l.forEach(x => $('evRacs').append(kartya(x)));
  if (!l.length) {
    const u = $('uzenet'); u.hidden = false;
    if (q) u.textContent = 'Nincs a keresésnek megfelelő esemény.';
    else if (korabbi) u.textContent = 'Még nincs korábbi esemény.';
    else { u.textContent = 'Jelenleg nincs közelgő esemény. '; if (lista.some(elmult)) { const a = el('a', '', 'Korábbi események »'); a.href = './?korabbi=1'; u.append(a); } }
  }
})();
</script>
</body>
</html>
